name: Nightly Flake Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  flake-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: nightly-flake
      cancel-in-progress: true
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run flake tests
        run: |
          mkdir -p coverage
          bun test --rerun-each 50 --bail=1

      - name: Upload JUnit report (flake)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-flake
          path: coverage/junit.xml
          retention-days: 7

      - name: Upload coverage lcov (flake)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-flake
          path: coverage/lcov.info
          retention-days: 7
