name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (app)
        run: bun run type-check

      - name: Type check (tests)
        run: bun run type-check:test

      - name: Type check (app, strict libs)
        run: bun run type-check:strict

      - name: Lint
        run: bun run lint

      - name: Run tests (coverage + bail)
        run: |
          mkdir -p coverage
          bun test --coverage --bail

      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: coverage/junit.xml
