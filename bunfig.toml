[test]
# Enable coverage reporting
coverage = true
coverageReporter = ["text", "lcov"]

# Skip test files from coverage
coverageSkipTestFiles = true

# Preload setup files
preload = ["./__tests__/dom-setup.ts", "./__tests__/setup.ts"]

# Test timeout (10 seconds)
timeout = 10000

# Coverage directory
coverageDirectory = "coverage"

# Coverage thresholds - temporarily disabled to debug
# Enforce minimum coverage (tune upward over time)
coverageThreshold = { lines = 0.8, functions = 0.75, statements = 0.8 }

# Ignore patterns for coverage
coveragePathIgnorePatterns = [
  "**/*.d.ts",
  "**/*.config.*",
  "**/node_modules/**",
  "**/__tests__/**",
  "**/coverage/**",
  "**/.next/**"
]

[test.reporter]
# JUnit XML output for CI test reporting (use coverage dir to avoid mkdir issues)
junit = "coverage/junit.xml"
